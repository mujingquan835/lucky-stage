name: lucky-stage
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: lottery
      POSTGRES_USER: lottery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请配置 POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U lottery -d lottery]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1"
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请配置至少12位管理员密码}
      APP_ORIGIN: ${APP_ORIGIN:?请配置HTTPS站点地址}
      DATABASE_URL: ${DATABASE_URL:-postgres://lottery:${POSTGRES_PASSWORD}@db:5432/lottery}
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - app_data:/app/data
      - ./backups:/app/backups
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2
    profiles: [https]
    restart: unless-stopped
    depends_on: [app]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?请配置域名}
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  postgres_data:
  app_data:
  caddy_data:
  caddy_config:
